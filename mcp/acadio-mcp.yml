name: Acadio Storefront (Universal Commerce Protocol)
description: >-
  A live, unauthenticated remote MCP server on Acadio's own domain that exposes the company's
  direct-to-learner securities exam prep storefront to agents: catalog search and lookup, cart
  construction, checkout lifecycle and order retrieval. It is a Universal Commerce Protocol
  (dev.ucp.shopping) service provided by the Shopify commerce platform Acadio's storefront runs on,
  served from acadio.com and identified in its own merchant profile as merchant_name "Acadio",
  merchant_origin "acadio.com". It does NOT expose the Acadio LMS platform.
status: live
deployment:
  mode: remote
  endpoint: https://acadio.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    No install step and no stdio package — an agent can POST to this URL today. tools/list answers
    anonymously; completing a checkout still requires contemporaneous buyer approval per the
    published agent instructions.
protocol:
  transport: mcp
  ucp_versions:
  - '2026-08-25'
  - '2026-04-08'
  - '2026-01-23'
  ucp_service: dev.ucp.shopping
  openrpc_schema: https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
  note: >-
    The OpenRPC schema above is published by the UCP specification, not by Acadio; it is referenced
    from Acadio's own /.well-known/ucp document and is recorded as the shape the endpoint implements,
    not as an Acadio-authored contract.
