apis:
- aid: acadio:acadio-lms-platform
  name: Acadio LMS Platform
  description: The Acadio LMS platform surface. Acadio operates an API gateway at api.acadio.com (its
    own status page lists an "API — Acadio API Services" component) and documents integration entry points
    in its knowledge base — JWT authentication, Google OAuth 2.0 and an HMAC-signed webhook bus — but
    publishes no OpenAPI, no API reference and no route catalog. Every documented path is an inbound integration
    hook rather than a callable REST resource.
