- aid: acadio:acadio-storefront-ucp
  name: Acadio Storefront Agentic Commerce (UCP)
  description: Acadio's direct-to-learner course storefront implements the Universal Commerce Protocol
    over MCP. A live, unauthenticated MCP endpoint at https://acadio.com/api/ucp/mcp answers tools/list
    with thirteen catalog, cart, checkout and order tools carrying full JSON Schema inputSchemas, and
    https://acadio.com/.well-known/ucp publishes the merchant profile (merchant_name "Acadio", merchant_origin
    acadio.com). The surface is provided by the Shopify commerce platform and served from Acadio's own
    domain.
  humanURL: https://acadio.com/agents.md
  baseURL: https://acadio.com/api/ucp/mcp
