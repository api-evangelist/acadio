aid: acadio
name: Acadio
description: 'Acadio is a professional-education technology company that builds and operates Acadio LMS,
  a white-label, cloud-hosted learning management system purpose-built for continuing education, exam
  prep and certification training. The platform runs branded student and admin portals on acadio.com subdomains,
  handles course authoring, SCORM 1.2/2004 import, assessments, credits, certificates and regulator reporting,
  and is sold as a flat per-learner, per-month subscription. Acadio also sells its own FINRA securities
  licensing exam prep courses (SIE, Series 6, Series 7, Series 63) direct to learners through a Shopify
  storefront at acadio.com. Its public integration surface is documented in a knowledge base rather than
  an API reference: JWT single sign-on, Google OAuth 2.0, and an HMAC-signed webhook bus with nineteen
  topics, plus native connectors for Shopify, WooCommerce, BigCommerce, Zoom, ProctorFree and ChatGPT.
  The storefront additionally exposes a live, unauthenticated Universal Commerce Protocol MCP endpoint
  for agent-driven purchasing.'
